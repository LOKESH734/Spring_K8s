version: "3.8"

volumes:
  mysql-data:

services:
  db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: JobReal
      MYSQL_ROOT_PASSWORD: tiger
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: spring-backend
    ports:
      - "8086:8086"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: C:\Users\lokes\job-portal-frontend69
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
